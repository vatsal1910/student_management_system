<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="back-link" href="{{ url_for('home') }}">Back to Home</a>
        <h1>Admin Login</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages" aria-live="polite">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}" role="alert">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-field">
                <label for="username_or_email">Username or Email</label>
                <input
                    id="username_or_email"
                    name="username_or_email"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>
            <button class="button-link login-button" type="submit">Login</button>
        </form>
    </main>
</body>
</html>
