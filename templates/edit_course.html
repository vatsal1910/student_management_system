<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Course</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<header class="dashboard-header">

    <div>

        <h1>Student Management System</h1>

        <p>Edit Course</p>

    </div>


    <div class="header-right">

        <a
            href="{{ url_for('courses') }}"
            class="logout-btn"
        >
            Courses
        </a>

        <a
            href="{{ url_for('admin_logout') }}"
            class="logout-btn"
        >
            Logout
        </a>

    </div>

</header>


<main class="dashboard-content">

    <div class="details-container">

        <h2>Edit Course</h2>


        <form
            method="POST"
            class="student-form"
        >

            <!-- COURSE NAME -->

            <div class="form-group">

                <label>
                    Course Name
                </label>

                <input
                    type="text"
                    name="course_name"
                    value="{{ course.course_name }}"
                    required
                >

            </div>


            <!-- COURSE CODE -->

            <div class="form-group">

                <label>
                    Course Code
                </label>

                <input
                    type="text"
                    name="course_code"
                    value="{{ course.course_code }}"
                    maxlength="20"
                    required
                >

            </div>


            <!-- COURSE DURATION -->

            <div class="form-group">

                <label>
                    Duration (Years)
                </label>

                <input
                    type="number"
                    name="duration_years"
                    value="{{ course.duration_years }}"
                    min="1"
                    required
                >

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label>
                    Department
                </label>

                <select
                    name="department_id"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    {% for department in departments %}

                    <option
                        value="{{ department.id }}"
                        {% if department.id == course.department_id %}
                            selected
                        {% endif %}
                    >

                        {{ department.department_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="dashboard-btn"
                >
                    Update Course
                </button>


                <a
                    href="{{ url_for('courses') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>

</html>
